[plugin]
enabled = true
config_version = "1.0.0"
# 「麦麦喊新人说话！」插件的 config.toml 完整路径（可选）；留空自动在插件目录同级查找
# sibling_probation_config = ""

[scope]
whitelist = []
blacklist = []

[events.group_increase]
enabled = true
mode = "context"
template = "欢迎 {member_name} 加入 {group_name}！"

[events.group_decrease]
enabled = true
mode = "context"
template = ""

[events.group_ban]
enabled = true
mode = "context"
template = ""

[events.group_name]
enabled = true
mode = "context"
template = ""

[events.group_admin]
enabled = true
mode = "context"
template = ""

[self_ban]
mode = "context"
admin_qqs = []

[llm]
model = "planner"
temperature = 1
max_tokens = 0

[probation]
enabled = false
probation_hours = 48
check_interval_minutes = 30
reject_add_request = false
whitelist = []

[probation.greet]
mode = "template"
fallback_to_template = true
template = "欢迎新朋友加入～出来冒个泡认识一下？"

[probation.kick_message]
mode = "template"
fallback_to_template = true
template = "成员 {member_name}（QQ {user_id}）加入超过 {probation_hours} 小时未发言，已移出群聊。"

[probation.llm]
model = "planner"
temperature = 0.8
max_tokens = 128

[query]
# 群数据查询工具防护：默认仅允许查询当前会话群，跨群仅放行下方授权管理员
# 保留 true（严格模式，推荐）；关闭可查任意群（不推荐）
default_to_current_session = true
admin_qqs = []

